services:
  - type: web
    name: ai-attendance-api
    runtime: python
    rootDir: backend
    plan: free
    # dlib needs a compile toolchain; keep startup honest by importing the ML stack.
    buildCommand: apt-get update && apt-get install -y build-essential cmake && pip install -e ".[ml]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # your Vercel URL, e.g. https://ai-attendance.vercel.app
      - key: DATABASE_URL
        sync: false  # your Neon Postgres connection string (postgresql+psycopg://...)
