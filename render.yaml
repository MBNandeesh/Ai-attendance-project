services:
  - type: web
    name: ai-attendance-api
    runtime: python
    rootDir: backend
    plan: free
    # ml-core = prebuilt dlib wheels + face models (face attendance works).
    # Full [ml] adds torch/resemblyzer — exceeds free-tier RAM, causes OOM; voice stays 503 by design.
    # No apt-get here: Render's native Python runtime has a read-only system, and
    # dlib-bin ships prebuilt (no compiler needed). git is preinstalled for the
    # face_recognition_models git dependency.
    buildCommand: pip install -e ".[ml-core]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # your Vercel URL, e.g. https://ai-attendance.vercel.app
      - key: DATABASE_URL
        sync: false  # your Neon Postgres connection string (postgresql+psycopg://...)
