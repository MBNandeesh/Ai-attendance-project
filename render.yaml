services:
  - type: web
    name: ai-attendance-api
    runtime: python
    rootDir: backend
    plan: free
    # ml-core = prebuilt dlib wheels + face models (face attendance works).
    # Full [ml] adds torch/resemblyzer — exceeds free-tier RAM, causes OOM; voice stays 503 by design.
    # git is required to pip-install face_recognition_models from GitHub.
    buildCommand: apt-get update && apt-get install -y build-essential cmake git && pip install -e ".[ml-core]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false  # your Vercel URL, e.g. https://ai-attendance.vercel.app
      - key: DATABASE_URL
        sync: false  # your Neon Postgres connection string (postgresql+psycopg://...)
