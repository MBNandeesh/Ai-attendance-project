[project]
name = "ai-attendance-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Attendance System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
ml = [
    "ai-attendance-backend[ml-core]",
    "librosa>=0.10",
    "resemblyzer>=0.1.3",
]
ml-core = [
    "dlib-bin>=19.24",
    "face-recognition-models @ git+https://github.com/ageitgey/face_recognition_models",
    "setuptools<70.0.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI requires function calls (Depends) in argument defaults
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
